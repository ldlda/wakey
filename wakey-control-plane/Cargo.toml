[package]
name = "wakey-control-plane"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws", "json"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
nix = { version = "0.30", default-features = false, features = ["signal", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sled = "0.34"
toml = "0.8"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "fs",
    "sync",
    "time",
    "signal",
] }
tower-http = { version = "0.6.8", features = ["fs"] }
tracing = "0.1"
tracing-opentelemetry = "0.32"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "time"] }
time = { version = "0.3", features = ["formatting", "local-offset"] }
opentelemetry = "0.31"
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
uuid = { version = "1", features = ["v4", "serde"] }
wakey-agent = { path = "../wakey-agent", registry = "gitea" }
