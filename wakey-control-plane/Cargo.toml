[package]
name = "wakey-control-plane"
version = "0.3.6"
edition = "2024"
publish = ["gitea"]

[dependencies]
anyhow = { workspace = true }
axum = { version = "0.8", features = ["ws", "json"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
macaddr = { workspace = true }
nix = { version = "0.31", default-features = false, features = [
    "signal",
    "process",
] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }
serde = { workspace = true }
serde_json = { workspace = true }

sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
    "uuid",
    "json",
] }
toml = "1.1"
tokio = { workspace = true }
tower-http = { version = "0.6.8", features = ["fs"] }
tracing = { workspace = true }
uuid = { workspace = true }
wakey-agent = { path = "../wakey-agent", registry = "gitea", version = "0" }
wakey-core = { path = "../wakey-core", registry = "gitea", version = "0", features = ["telemetry"] }
