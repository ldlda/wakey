[package]
name = "wakey-control-plane"
version = "0.3.6"
edition = "2024"
publish = ["gitea"]

[dependencies]
anyhow = { workspace = true }
axum = { version = "0.8", features = ["ws", "json"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
humantime-serde = "1"
http-cache-semantics = { version = "3", default-features = false, features = ["reqwest"] }
jsonwebtoken = { version = "10.3", default-features = false, features = ["aws_lc_rs"] }
macaddr = { workspace = true }
nix = { version = "0.31", default-features = false, features = [
    "signal",
    "process",
] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2"

sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
    "uuid",
    "json",
] }
toml = "1.1"
tokio = { workspace = true }
tower-http = { version = "0.6.8", features = ["fs"] }
tracing = { workspace = true }
uuid = { workspace = true }
wakey-agent = { path = "../wakey-agent", registry = "gitea", version = "0" }
wakey-core = { path = "../wakey-core", registry = "gitea", version = "0", features = ["telemetry"] }

[target.'cfg(target_os = "linux")'.dependencies]
wakey-linux = { path = "../wakey-linux", registry = "gitea", version = "0", features = ["telemetry"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
jsonwebtoken = { version = "10.3", default-features = false, features = ["use_pem", "aws_lc_rs"] }
