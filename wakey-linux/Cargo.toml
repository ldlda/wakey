[package]
name = "wakey-linux"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
futures = "0"
macaddr = { version = "1", features = ["serde", "serde_std"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "net", "rt", "sync"] }
wakey-core = { path = "../wakey-core" }

[dependencies.lda-ipjs]
path = "../ipjs"
registry = "gitea"
version = "*"
features = ["experimental-nl"]
