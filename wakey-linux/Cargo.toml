[package]
name = "wakey-linux"
version = "0.3.6"
edition = "2024"
publish = ["gitea"]

[dependencies]
anyhow = { workspace = true }
futures = "0"
macaddr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "sync"] }
tracing = "0.1"
wakey-core = { path = "../wakey-core", registry = "gitea", version = "0"}

[dev-dependencies]
serial_test = "3"

[features]
telemetry = ["wakey-core/telemetry", "dep:procfs"]

[target.'cfg(target_os = "linux")'.dependencies]
procfs = { version = "0.18", default-features = false, optional = true }

[dependencies.lda-ipjs]
path = "../ipjs"
registry = "gitea"
version = "0"
features = ["experimental-nl"]

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = [
    "signal",
    "process",
    "term",
] }
pty-process = { version = "0.5", features = ["async"] }
