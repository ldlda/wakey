[package]
name = "wakey-linux"
version = "0.4.0"
edition = "2024"
publish = ["gitea"]

[features]
telemetry = ["dep:procfs", "wakey-core/telemetry"]

[dependencies]
anyhow = { workspace = true }
futures = "0"
macaddr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "sync"] }
tracing = "0.1"
wakey-core = { path = "../wakey-core", version = "0.4.0", registry = "gitea" }

[dependencies.lda-ipjs]
path = "../ipjs"
version = "0.0.5"
features = ["experimental-nl"]
registry = "gitea"

[dev-dependencies]
serial_test = "3"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", default-features = false, features = ["net"] }
procfs = { version = "0.18", default-features = false, optional = true }
rand = "0.10"
surge-ping = "0.9.1"

[target."cfg(unix)".dependencies]
nix = {
  version = "0.31",
  default-features = false,
  features = [
    "process",
    "signal",
    "term",
  ]
}
pty-process = { version = "0.5", features = ["async"] }
