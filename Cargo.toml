[package]
name = "wakey"
version = "0.1.7"
edition = "2024"
publish = ["gitea"]

[dependencies]
anyhow = "1"
axum = { version = "0", features = ["macros"] }
axum-extra = { version = "0", features = ["query"] }
color-eyre = "0"
futures = "0"
macaddr = { version = "1", features = ["serde", "serde_std"] }
serde = { version = "1", features = ["derive"] }
serde_html_form = "0"
serde_json = "1"
serde_with = { version = "3", features = ["json"] }
strum = { version = "0", features = ["derive", "strum_macros"] }
thiserror = "2"
tokio = { version = "1", features = [
    "fs",
    "process",
    "rt-multi-thread",
    "io-util",
    "macros",
] }
tower-http = { version = "0", features = ["fs"] }
urlencoding = "2"

[profile.release]
opt-level = "z"
strip = true

[features]
default = ["very-smart-parsing"]
very-smart-parsing = [
] # this is the a-bit-redundant parse thing that copilot made

[workspace]
members = ["ipjs"]

[dependencies.lda-ipjs]
path = "ipjs"
registry = "gitea"
version = "*"
