[package]
name = "wakey-core"
version = "0.3.6"
edition = "2024"
publish = ["gitea"]

[dependencies]
anyhow = { workspace = true, optional = true }
opentelemetry = { version = "0.33", optional = true }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["grpc-tonic", "trace", "logs", "metrics"], optional = true }
opentelemetry_sdk = { version = "0.33", optional = true }
opentelemetry-appender-tracing = { version = "0.33", optional = true }
tracing = { workspace = true, optional = true }
tracing-opentelemetry = { version = "0.34", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "time"], optional = true }
time = { version = "0.3", features = ["formatting", "local-offset"], optional = true }
tonic = { version = "0.14", default-features = false, optional = true }
macaddr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
humantime = "2"
serde_with = { version = "3", features = ["json"] }
strum = { version = "0", features = ["derive", "strum_macros"] }
thiserror = "2"

[features]
telemetry = ["dep:anyhow", "dep:opentelemetry", "dep:opentelemetry-otlp", "dep:opentelemetry_sdk", "dep:opentelemetry-appender-tracing", "dep:tracing", "dep:tracing-opentelemetry", "dep:tracing-subscriber", "dep:time", "dep:tonic"]

[dev-dependencies]
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic", "trace", "logs", "metrics"] }
