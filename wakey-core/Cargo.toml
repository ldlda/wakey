[package]
name = "wakey-core"
version = "0.3.3"
edition = "2024"
publish = ["gitea"]

[dependencies]
macaddr = { workspace = true }
serde = { workspace = true }
serde_with = { version = "3", features = ["json"] }
strum = { version = "0", features = ["derive", "strum_macros"] }
thiserror = "2"

[dev-dependencies]
serde_json.workspace = true
